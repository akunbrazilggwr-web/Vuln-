<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Lab XSS</title><link rel="stylesheet" href="../css/style.css"></head><body><main class="section"><p class="eyebrow">LAB 01</p><h1>Reflected XSS</h1><p>Tujuan: pahami mengapa output encoding penting. Demo ini sengaja menggunakan textContent untuk menunjukkan perilaku aman.</p><form id="f"><input id="q" placeholder="Masukkan teks uji" style="padding:12px;width:min(600px,100%)"><button class="button">Render</button></form><div id="out" style="margin-top:25px;padding:20px;border:1px solid #234238"></div><h2>Pelajaran</h2><p>Jangan memasukkan input pengguna langsung ke HTML. Gunakan context-aware output encoding dan validasi input sesuai kebutuhan.</p><button class="button" onclick="localStorage.setItem('lab-xss','done');location.href='../index.html'">Tandai selesai</button></main><script>f.onsubmit=e=>{e.preventDefault();out.textContent=q.value}</script></body></html>
